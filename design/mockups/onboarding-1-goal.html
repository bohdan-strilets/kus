<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kusik — перший запуск</title>
</head>
<body>
<div class="board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9521A}a:hover{color:#8F3E12}
button{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(165deg, #FCEBD8 0%, #FBF6EE 50%, #EEF4E8 100%); color: #2A2118; font-family: 'Manrope', sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 10px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="42" height="42" viewBox="0 0 100 100" aria-hidden="true" style="filter: drop-shadow(0 6px 10px rgba(150, 70, 20, 0.2))"><defs><linearGradient id="kgFR" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#FFB877"></stop><stop offset="1" stop-color="#D45F22"></stop></linearGradient><mask id="kbFR"><rect width="100" height="100" fill="#FFFFFF"></rect><circle cx="91" cy="31" r="10" fill="#000000"></circle><circle cx="83" cy="18" r="10" fill="#000000"></circle><circle cx="70" cy="10" r="9.5" fill="#000000"></circle></mask></defs><circle cx="50" cy="50" r="42" fill="url(#kgFR)" mask="url(#kbFR)"></circle><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.04em">kusik</span>
</div>
<span style="font-size: 13px; font-weight: 600; color: #6B5D50">Крок 1 з 4</span>
</header>

<div style="margin: 0 16px; padding: 18px 18px 16px; border-radius: 26px; background: rgba(255, 255, 255, 0.8); box-shadow: 0 10px 28px rgba(80, 50, 20, 0.10); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 84px; height: 84px; border-radius: 26px; background: linear-gradient(140deg, #E6F6C9, #FDE6D3); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="80" height="80" viewBox="0 0 120 120" aria-label="Хом'як Kusik махає лапкою"><defs><linearGradient id="hgFR" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#FFB877"></stop><stop offset="1" stop-color="#D45F22"></stop></linearGradient><mask id="hbFR"><rect width="120" height="120" fill="#FFFFFF"></rect><circle cx="74.6" cy="91.2" r="3.6" fill="#000000"></circle><circle cx="71.8" cy="86.6" r="3.6" fill="#000000"></circle><circle cx="67.1" cy="83.7" r="3.4" fill="#000000"></circle></mask></defs><ellipse cx="42" cy="111" rx="10" ry="5" fill="#E89A68"></ellipse><ellipse cx="78" cy="111" rx="10" ry="5" fill="#E89A68"></ellipse><circle cx="35" cy="30" r="11" fill="#E89A68"></circle><circle cx="35" cy="31" r="6" fill="#F7B3A2"></circle><circle cx="85" cy="30" r="11" fill="#E89A68"></circle><circle cx="85" cy="31" r="6" fill="#F7B3A2"></circle><ellipse cx="60" cy="68" rx="45" ry="43" fill="#F6B98A"></ellipse><circle cx="29" cy="74" r="15" fill="#F9C7A0"></circle><circle cx="91" cy="74" r="15" fill="#F9C7A0"></circle><ellipse cx="60" cy="84" rx="30" ry="25" fill="#FFEBD8"></ellipse><ellipse cx="31" cy="72" rx="7" ry="4" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="89" cy="72" rx="7" ry="4" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="60" cy="67" rx="3.6" ry="2.6" fill="#D96B5C"></ellipse><circle cx="60" cy="98" r="15" fill="url(#hgFR)" mask="url(#hbFR)"></circle><text x="58.5" y="104" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="16" fill="#FFF4E6">k</text><ellipse cx="76" cy="98" rx="6.5" ry="5.5" fill="#E89A68"></ellipse><ellipse cx="18" cy="46" rx="6.5" ry="7.5" fill="#E89A68"></ellipse><ellipse cx="47" cy="57" rx="4.6" ry="5.6" fill="#2B1D14"></ellipse><circle cx="48.6" cy="55" r="1.7" fill="#FFFFFF"></circle><ellipse cx="73" cy="57" rx="4.6" ry="5.6" fill="#2B1D14"></ellipse><circle cx="74.6" cy="55" r="1.7" fill="#FFFFFF"></circle><path d="M54 72 Q57 75 60 72 Q63 75 66 72" stroke="#2B1D14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><rect x="57" y="73.6" width="2.8" height="3.8" rx="0.8" fill="#FFFFFF"></rect><rect x="60.2" y="73.6" width="2.8" height="3.8" rx="0.8" fill="#FFFFFF"></rect></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2">Пиши, що їв.<br>Решту порахую сам.</span>
<span style="font-size: 13px; color: #6B5D50">Без пошуку в базах і грамів наосліп</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: #6B5D50; letter-spacing: 0.04em; text-transform: uppercase">Наприклад</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="padding: 6px 10px; border-radius: 12px; background: #F3ECE3; font-size: 13px; font-weight: 600">«2 яйця і тост з маслом»</span>
<span style="padding: 6px 10px; border-radius: 12px; background: #F3ECE3; font-size: 13px; font-weight: 600">«що на вечерю?»</span>
<span style="padding: 6px 10px; border-radius: 12px; background: #F3ECE3; font-size: 13px; font-weight: 600">«скільки білка за тиждень?»</span>
</div>
</div>
</div>

<main style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 14px 16px 10px">

<div style="align-self: flex-start; max-width: 90%; padding: 12px 14px; border-radius: 22px 22px 22px 6px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 10px 28px rgba(80, 50, 20, 0.10); font-size: 15px; line-height: 1.45">Привіт! Я Kusik — твій помічник з харчування. Щоб рахувати точно, познайомимось: 4 короткі питання, менше хвилини.</div>

<div style="align-self: flex-start; width: 90%; padding: 14px; border-radius: 22px 22px 22px 6px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 10px 28px rgba(80, 50, 20, 0.10); display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Яка в тебе ціль?</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 16px; border: 2px solid #B9521A; background: #FDEBDB; cursor: pointer; text-align: left; color: #2A2118">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9521A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l6 6 4-4 6 6"></path><path d="M20 10v5h-5"></path></svg>
</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Схуднути</span><span style="font-size: 12px; color: #4F4237">м'який дефіцит, без голоду</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9521A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 16px; border: 2px solid transparent; background: #F7F1E9; cursor: pointer; text-align: left; color: #2A2118">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D5568" stroke-width="2.2" stroke-linecap="round"><path d="M4 12h16M4 8h16M4 16h16"></path></svg>
</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Тримати вагу</span><span style="font-size: 12px; color: #4F4237">харчуватися усвідомлено</span></span>
</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 16px; border: 2px solid transparent; background: #F7F1E9; cursor: pointer; text-align: left; color: #2A2118">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4A12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12"></path></svg>
</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Набрати м'язи</span><span style="font-size: 12px; color: #4F4237">більше білка й енергії</span></span>
</button>
</div>
</div>

</main>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 0 10px" aria-label="Крок 1 з 4">
<span style="width: 22px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #DDCFC0"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #DDCFC0"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #DDCFC0"></span>
</div>

<form style="margin: 0 16px 10px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(80, 50, 20, 0.12)">
<label for="msg4" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Відповідь</label>
<input id="msg4" type="text" placeholder="Або напиши своїми словами…" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Manrope', sans-serif; font-size: 15px; color: #2A2118; height: 38px">
<button type="submit" aria-label="Надіслати" style="width: 42px; height: 42px; border-radius: 21px; border: none; background: #B9521A; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</form>

<div style="display: flex; justify-content: center; padding: 0 0 24px">
<button style="min-height: 44px; padding: 0 16px; border: none; background: none; font-size: 14px; font-weight: 600; color: #4F4237; cursor: pointer; text-decoration: underline">Пропустити й почати одразу</button>
</div>

</div>
</div>
</body>
</html>
