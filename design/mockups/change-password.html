</head>
<body>
<div class="board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9521A}a:hover{color:#8F3E12}

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(165deg, #FCEBD8 0%, #FBF6EE 50%, #EEF4E8 100%); color: #2A2118; font-family: 'Manrope', sans-serif; overflow: hidden; flex: none">

<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Змінити пароль</span>

<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px">
<form style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(80, 50, 20, 0.06)"><label for="cp-old" style="font-size: 12px; font-weight: 600; color: #6B5D50">Поточний пароль</label><input id="cp-old" type="password" value="oldpassword1" style="border: none; outline: none; background: transparent; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 600; color: #2A2118; padding: 0; min-height: 24px"></div></div>
<div style="height: 6px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(80, 50, 20, 0.06)"><label for="cp-new" style="font-size: 12px; font-weight: 600; color: #6B5D50">Новий пароль</label><input id="cp-new" type="password" value="kusik-2026-nov" style="border: none; outline: none; background: transparent; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 600; color: #2A2118; padding: 0; min-height: 24px"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 6px 16px rgba(80, 50, 20, 0.06)"><label for="cp-new2" style="font-size: 12px; font-weight: 600; color: #6B5D50">Повтори новий пароль</label><input id="cp-new2" type="password" value="kusik-2026-nov" style="border: none; outline: none; background: transparent; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 600; color: #2A2118; padding: 0; min-height: 24px"></div></div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #0F5E40"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17845A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Щонайменше 10 символів</span>

</form>
<span style="font-size: 13px; line-height: 1.45; color: #6B5D50; padding: 0 4px">Після зміни пароля інші пристрої вийдуть з акаунта.</span>
