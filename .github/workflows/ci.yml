name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# public repo: the workflow only needs to read the code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall builds @kus/shared and generates the Prisma client
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # tests run through Vite; only a real build checks the prod path (CJS api requiring ESM shared)
      - run: pnpm build
