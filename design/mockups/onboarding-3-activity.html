<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kusik — онбординг, активність</title>
</head>
<body>
<div class="board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9521A}a:hover{color:#8F3E12}
button{font-family:inherit}
input{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(165deg, #FCEBD8 0%, #FBF6EE 50%, #EEF4E8 100%); color: #2A2118; font-family: 'Manrope', sans-serif; overflow: hidden; position: relative">

<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><symbol id="kh" viewBox="0 0 100 100"><circle cx="27" cy="24" r="10" fill="#E89A68"></circle><circle cx="27" cy="25" r="5.5" fill="#F7B3A2"></circle><circle cx="73" cy="24" r="10" fill="#E89A68"></circle><circle cx="73" cy="25" r="5.5" fill="#F7B3A2"></circle><ellipse cx="50" cy="56" rx="41" ry="38" fill="#F6B98A"></ellipse><circle cx="22" cy="64" r="13" fill="#F9C7A0"></circle><circle cx="78" cy="64" r="13" fill="#F9C7A0"></circle><ellipse cx="50" cy="72" rx="25" ry="20" fill="#FFEBD8"></ellipse><ellipse cx="24" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="76" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="50" cy="58" rx="3.6" ry="2.6" fill="#D96B5C"></ellipse></symbol><linearGradient id="kgO3" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#FFB877"></stop><stop offset="1" stop-color="#D45F22"></stop></linearGradient><mask id="kbO3"><rect width="100" height="100" fill="#FFFFFF"></rect><circle cx="91" cy="31" r="10" fill="#000000"></circle><circle cx="83" cy="18" r="10" fill="#000000"></circle><circle cx="70" cy="10" r="9.5" fill="#000000"></circle></mask></defs></svg>

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 10px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="url(#kgO3)" mask="url(#kbO3)"></circle><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.04em">kusik</span>
</div>
<span style="font-size: 13px; font-weight: 600; color: #6B5D50">Крок 3 з 4</span>
</header>

<main style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 10px 16px 10px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px); mask-image: linear-gradient(to bottom, transparent 0, #000 36px)">

<div style="align-self: flex-end; max-width: 80%; padding: 11px 15px; border-radius: 20px 20px 6px 20px; background: #B9521A; color: #FFFFFF; font-size: 15px; font-weight: 500; line-height: 1.4; box-shadow: 0 6px 16px rgba(185, 82, 26, 0.25)">Чоловік, 30 років, 182 см, 84 кг → 78 кг</div>

<div style="align-self: stretch; display: flex; align-items: flex-end; gap: 8px; padding-right: 4%">
<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><use href="#kh"></use><ellipse cx="38" cy="47" rx="4.4" ry="5.4" fill="#2B1D14"></ellipse><circle cx="39.5" cy="45" r="1.6" fill="#FFFFFF"></circle><ellipse cx="62" cy="47" rx="4.4" ry="5.4" fill="#2B1D14"></ellipse><circle cx="63.5" cy="45" r="1.6" fill="#FFFFFF"></circle><path d="M44 63 Q47 66 50 63 Q53 66 56 63" stroke="#2B1D14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><rect x="47.2" y="64.4" width="2.6" height="3.6" rx="0.8" fill="#FFFFFF"></rect><rect x="50.2" y="64.4" width="2.6" height="3.6" rx="0.8" fill="#FFFFFF"></rect></svg>
<div style="flex: 1 1 auto; min-width: 0; padding: 14px; border-radius: 22px 22px 22px 6px; background: rgba(255, 255, 255, 0.94); box-shadow: 0 10px 28px rgba(80, 50, 20, 0.10); display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; line-height: 1.45">Записав: мінус 6 кг, цілком реально. Скільки ти рухаєшся протягом звичайного тижня?</span>
<div style="display: flex; flex-direction: column; gap: 8px">

<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 14px 6px 6px; border-radius: 16px; border: 2px solid transparent; background: #F7F1E9; cursor: pointer; text-align: left; color: #2A2118">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D5568" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="10" rx="1.5"></rect><path d="M9 19h6M12 15v4"></path></svg></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Мало руху</span><span style="font-size: 12px; color: #4F4237">сидяча робота, до 5 тис. кроків</span></span>
</button>

<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 14px 6px 6px; border-radius: 16px; border: 2px solid #B9521A; background: #FDEBDB; cursor: pointer; text-align: left; color: #2A2118" aria-pressed="true">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9521A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="2"></circle><path d="M9 21l2-6 3 2v4M7 12l3-4h4l2 4 3 1"></path></svg></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Трохи руху</span><span style="font-size: 12px; color: #4F4237">1–2 тренування або 5–8 тис. кроків</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9521A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>

<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 14px 6px 6px; border-radius: 16px; border: 2px solid transparent; background: #F7F1E9; cursor: pointer; text-align: left; color: #2A2118">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A4A12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12"></path></svg></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Активно</span><span style="font-size: 12px; color: #4F4237">3–4 тренування на тиждень</span></span>
</button>

<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 14px 6px 6px; border-radius: 16px; border: 2px solid transparent; background: #F7F1E9; cursor: pointer; text-align: left; color: #2A2118">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B05A26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 1-3 0 2 1 3 2 3 0-3-1-5 1-8z"></path></svg></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Дуже активно</span><span style="font-size: 12px; color: #4F4237">фізична робота або спорт щодня</span></span>
</button>

</div>
<span style="font-size: 12px; line-height: 1.4; color: #6B5D50">Не впевнений? Обери найближче. За перші два тижні я підлаштую норму під твою реальну вагу.</span>
</div>
</div>

</main>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 0 10px" aria-label="Крок 3 з 4">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #DDCFC0"></span>
</div>

<form style="margin: 0 16px 10px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(80, 50, 20, 0.12)">
<label for="msg-o3" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Відповідь</label>
<input id="msg-o3" type="text" placeholder="Або опиши свій звичайний день…" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; color: #2A2118; height: 38px">
<button type="submit" aria-label="Надіслати" style="width: 42px; height: 42px; border-radius: 21px; border: none; background: #B9521A; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</form>

<div style="display: flex; justify-content: center; padding: 0 0 24px">
<button style="min-height: 44px; padding: 0 16px; border: none; background: none; font-size: 14px; font-weight: 600; color: #4F4237; cursor: pointer; text-decoration: underline">Пропустити й почати одразу</button>
</div>

</div>
</div>
</body>
</html>
