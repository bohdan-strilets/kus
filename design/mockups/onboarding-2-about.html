<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kusik — онбординг, про тебе</title>
</head>
<body>
<div class="board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9521A}a:hover{color:#8F3E12}
button{font-family:inherit}
input{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(165deg, #FCEBD8 0%, #FBF6EE 50%, #EEF4E8 100%); color: #2A2118; font-family: 'Manrope', sans-serif; overflow: hidden; position: relative">

<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><symbol id="kh" viewBox="0 0 100 100"><circle cx="27" cy="24" r="10" fill="#E89A68"></circle><circle cx="27" cy="25" r="5.5" fill="#F7B3A2"></circle><circle cx="73" cy="24" r="10" fill="#E89A68"></circle><circle cx="73" cy="25" r="5.5" fill="#F7B3A2"></circle><ellipse cx="50" cy="56" rx="41" ry="38" fill="#F6B98A"></ellipse><circle cx="22" cy="64" r="13" fill="#F9C7A0"></circle><circle cx="78" cy="64" r="13" fill="#F9C7A0"></circle><ellipse cx="50" cy="72" rx="25" ry="20" fill="#FFEBD8"></ellipse><ellipse cx="24" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="76" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="50" cy="58" rx="3.6" ry="2.6" fill="#D96B5C"></ellipse></symbol><linearGradient id="kgO2" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#FFB877"></stop><stop offset="1" stop-color="#D45F22"></stop></linearGradient><mask id="kbO2"><rect width="100" height="100" fill="#FFFFFF"></rect><circle cx="91" cy="31" r="10" fill="#000000"></circle><circle cx="83" cy="18" r="10" fill="#000000"></circle><circle cx="70" cy="10" r="9.5" fill="#000000"></circle></mask></defs></svg>

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 10px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="url(#kgO2)" mask="url(#kbO2)"></circle><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.04em">kusik</span>
</div>
<span style="font-size: 13px; font-weight: 600; color: #6B5D50">Крок 2 з 4</span>
</header>

<main style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 10px 16px 10px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px); mask-image: linear-gradient(to bottom, transparent 0, #000 36px)">

<div style="align-self: flex-start; margin-left: 42px; padding: 8px 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.55); font-size: 13px; color: #4F4237">Яка в тебе ціль?</div>

<div style="align-self: flex-end; max-width: 78%; padding: 11px 15px; border-radius: 20px 20px 6px 20px; background: #B9521A; color: #FFFFFF; font-size: 15px; font-weight: 500; line-height: 1.4; box-shadow: 0 6px 16px rgba(185, 82, 26, 0.25)">Схуднути</div>

<div style="align-self: stretch; display: flex; align-items: flex-end; gap: 8px; padding-right: 4%">
<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><use href="#kh"></use><ellipse cx="39.5" cy="45" rx="4.4" ry="5.4" fill="#2B1D14"></ellipse><circle cx="41" cy="43" r="1.6" fill="#FFFFFF"></circle><ellipse cx="63.5" cy="45" rx="4.4" ry="5.4" fill="#2B1D14"></ellipse><circle cx="65" cy="43" r="1.6" fill="#FFFFFF"></circle><ellipse cx="51" cy="65" rx="2.6" ry="3" fill="#2B1D14"></ellipse></svg>
<div style="flex: 1 1 auto; min-width: 0; padding: 14px; border-radius: 22px 22px 22px 6px; background: rgba(255, 255, 255, 0.94); box-shadow: 0 10px 28px rgba(80, 50, 20, 0.10); display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; line-height: 1.45">Супер, допоможу схуднути без голоду. Тепер трохи про тебе, щоб точно порахувати норму.</span>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #F3ECE3" role="group" aria-label="Стать">
<button style="min-height: 40px; border-radius: 11px; border: none; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #2A2118; cursor: pointer; box-shadow: 0 2px 6px rgba(80, 50, 20, 0.10)" aria-pressed="true">Чоловік</button>
<button style="min-height: 40px; border-radius: 11px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #4F4237; cursor: pointer" aria-pressed="false">Жінка</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 14px; background: #F7F1E9">
<label for="ob-age" style="font-size: 12px; font-weight: 600; color: #6B5D50">Вік</label>
<div style="display: flex; align-items: baseline; gap: 4px"><input id="ob-age" type="text" inputmode="numeric" value="30" style="width: 100%; min-width: 0; border: none; outline: none; background: transparent; font-size: 20px; font-weight: 800; color: #2A2118; padding: 0"><span style="font-size: 13px; color: #6B5D50">років</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 14px; background: #F7F1E9">
<label for="ob-height" style="font-size: 12px; font-weight: 600; color: #6B5D50">Зріст</label>
<div style="display: flex; align-items: baseline; gap: 4px"><input id="ob-height" type="text" inputmode="numeric" value="182" style="width: 100%; min-width: 0; border: none; outline: none; background: transparent; font-size: 20px; font-weight: 800; color: #2A2118; padding: 0"><span style="font-size: 13px; color: #6B5D50">см</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 14px; background: #F7F1E9">
<label for="ob-weight" style="font-size: 12px; font-weight: 600; color: #6B5D50">Вага зараз</label>
<div style="display: flex; align-items: baseline; gap: 4px"><input id="ob-weight" type="text" inputmode="decimal" value="84" style="width: 100%; min-width: 0; border: none; outline: none; background: transparent; font-size: 20px; font-weight: 800; color: #2A2118; padding: 0"><span style="font-size: 13px; color: #6B5D50">кг</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 14px; background: #FDEBDB; box-shadow: inset 0 0 0 2px #B9521A">
<label for="ob-target" style="font-size: 12px; font-weight: 600; color: #8F3E12">Бажана вага</label>
<div style="display: flex; align-items: baseline; gap: 4px"><input id="ob-target" type="text" inputmode="decimal" value="78" style="width: 100%; min-width: 0; border: none; outline: none; background: transparent; font-size: 20px; font-weight: 800; color: #2A2118; padding: 0"><span style="font-size: 13px; color: #8F3E12">кг</span></div>
</div>
</div>

<button style="min-height: 48px; border-radius: 24px; border: none; background: #B9521A; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">Далі</button>
<span style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #6B5D50"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B5D50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Ці дані бачиш тільки ти</span>
</div>
</div>

</main>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 0 10px" aria-label="Крок 2 з 4">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #DDCFC0"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #DDCFC0"></span>
</div>

<form style="margin: 0 16px 10px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(80, 50, 20, 0.12)">
<label for="msg-o2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Відповідь</label>
<input id="msg-o2" type="text" placeholder="Або напиши: «30 років, 182, 84 кг»" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; color: #2A2118; height: 38px">
<button type="submit" aria-label="Надіслати" style="width: 42px; height: 42px; border-radius: 21px; border: none; background: #B9521A; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</form>

<div style="display: flex; justify-content: center; padding: 0 0 24px">
<button style="min-height: 44px; padding: 0 16px; border: none; background: none; font-size: 14px; font-weight: 600; color: #4F4237; cursor: pointer; text-decoration: underline">Пропустити й почати одразу</button>
</div>

</div>
</div>
</body>
</html>
