<head>

<body>
<div class="board">

<link rel="preconnect" href="https://fonts.googleapis.com">

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(165deg, #FCEBD8 0%, #FBF6EE 50%, #EEF4E8 100%); color: #2A2118; font-family: 'Manrope', sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #6B5D50">Понеділок, 5 жовтня</span>
<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Сьогодні</span>
</div>
<div style="display: flex; gap: 8px">
<button aria-label="Попередній день" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255, 255, 255, 0.85); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(80, 50, 20, 0.08)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2118" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button aria-label="Наступний день" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8998A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</header>

<div style="margin: 0 16px; padding: 8px; border-radius: 22px; background: rgba(255, 255, 255, 0.7); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border: none; border-radius: 14px; background: transparent; cursor: pointer; color: #2A2118"><span style="font-size: 12px; color: #6B5D50">Вт</span><span style="font-size: 15px; font-weight: 700">29</span><span style="width: 6px; height: 6px; border-radius: 3px; background: #17845A"></span></button>
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border: none; border-radius: 14px; background: transparent; cursor: pointer; color: #2A2118"><span style="font-size: 12px; color: #6B5D50">Ср</span><span style="font-size: 15px; font-weight: 700">30</span><span style="width: 6px; height: 6px; border-radius: 3px; background: #C25A1C"></span></button>
<button style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border: none; border-radius: 14px; background: transparent; cursor: pointer; color: #2A2118"><span style="font-size: 12px; color: #6B5D50">Чт</span><span style="font-size: 15px; font-weight: 700">1</span><span style="width: 6px; height: 6px; border-radius: 3px; background: #17845A"></span></button>

<button aria-current="date" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border: none; border-radius: 14px; background: #2A2118; cursor: pointer; color: #FFFFFF"><span style="font-size: 12px; color: #D9CCBE">Пн</span><span style="font-size: 15px; font-weight: 700">5</span><span style="width: 6px; height: 6px; border-radius: 3px; background: #FFFFFF"></span></button>

<div style="display: flex; flex-direction: column; align-items: center; width: 62px"><span style="font-size: 17px; font-weight: 800">2 200</span><span style="font-size: 12px; color: #6B5D50">ціль</span></div></div>

</div>
<div style="padding: 10px; border-radius: 16px; background: #E6F6C9; display: flex; flex-direction: column; gap: 6px">

<span style="font-size: 15px; font-weight: 800">250<span style="font-size: 12px; font-weight: 500; color: #46592A"> / 225 г</span></span>

</div>

<span style="font-size: 15px; font-weight: 800">380</span>
</button>

<button style="display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 20px; border: none; background: rgba(255, 255, 255, 0.85); cursor: pointer; text-align: left; color: #2A2118">

<svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><circle cx="27" cy="24" r="10" fill="#E89A68"></circle><circle cx="27" cy="25" r="5.5" fill="#F7B3A2"></circle><circle cx="73" cy="24" r="10" fill="#E89A68"></circle><circle cx="73" cy="25" r="5.5" fill="#F7B3A2"></circle><ellipse cx="50" cy="56" rx="41" ry="38" fill="#F6B98A"></ellipse><circle cx="22" cy="64" r="13" fill="#F9C7A0"></circle><circle cx="78" cy="64" r="13" fill="#F9C7A0"></circle><ellipse cx="50" cy="72" rx="25" ry="20" fill="#FFEBD8"></ellipse><ellipse cx="24" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="76" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="50" cy="58" rx="3.6" ry="2.6" fill="#D96B5C"></ellipse><path d="M33.5 47 Q38 51 42.5 47" stroke="#2B1D14" stroke-width="3" stroke-linecap="round" fill="none"></path><path d="M57.5 47 Q62 51 66.5 47" stroke="#2B1D14" stroke-width="3" stroke-linecap="round" fill="none"></path><path d="M45 64 Q50 67 55 64" stroke="#2B1D14" stroke-width="2.4" stroke-linecap="round" fill="none"></path></svg>
<span style="flex: 1 1 auto; font-size: 13px; line-height: 1.4; color: #4F4237">Понад ціль на 180 — це менше за бутерброд. Завтра просто як завжди.</span>
</div>
