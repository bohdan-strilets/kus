<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kusik — онбординг, їжа</title>
</head>
<body>
<div class="board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9521A}a:hover{color:#8F3E12}
button{font-family:inherit}
input{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(165deg, #FCEBD8 0%, #FBF6EE 50%, #EEF4E8 100%); color: #2A2118; font-family: 'Manrope', sans-serif; overflow: hidden; position: relative">

<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs><symbol id="kh" viewBox="0 0 100 100"><circle cx="27" cy="24" r="10" fill="#E89A68"></circle><circle cx="27" cy="25" r="5.5" fill="#F7B3A2"></circle><circle cx="73" cy="24" r="10" fill="#E89A68"></circle><circle cx="73" cy="25" r="5.5" fill="#F7B3A2"></circle><ellipse cx="50" cy="56" rx="41" ry="38" fill="#F6B98A"></ellipse><circle cx="22" cy="64" r="13" fill="#F9C7A0"></circle><circle cx="78" cy="64" r="13" fill="#F9C7A0"></circle><ellipse cx="50" cy="72" rx="25" ry="20" fill="#FFEBD8"></ellipse><ellipse cx="24" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="76" cy="61" rx="6" ry="3.5" fill="#F28E7A" opacity="0.55"></ellipse><ellipse cx="50" cy="58" rx="3.6" ry="2.6" fill="#D96B5C"></ellipse></symbol><linearGradient id="kgO4" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#FFB877"></stop><stop offset="1" stop-color="#D45F22"></stop></linearGradient><mask id="kbO4"><rect width="100" height="100" fill="#FFFFFF"></rect><circle cx="91" cy="31" r="10" fill="#000000"></circle><circle cx="83" cy="18" r="10" fill="#000000"></circle><circle cx="70" cy="10" r="9.5" fill="#000000"></circle></mask></defs></svg>

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 10px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="url(#kgO4)" mask="url(#kbO4)"></circle><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.04em">kusik</span>
</div>
<span style="font-size: 13px; font-weight: 600; color: #6B5D50">Крок 4 з 4</span>
</header>

<main style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 10px 16px 10px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px); mask-image: linear-gradient(to bottom, transparent 0, #000 36px)">

<div style="align-self: flex-end; max-width: 78%; padding: 11px 15px; border-radius: 20px 20px 6px 20px; background: #B9521A; color: #FFFFFF; font-size: 15px; font-weight: 500; line-height: 1.4; box-shadow: 0 6px 16px rgba(185, 82, 26, 0.25)">Трохи руху</div>

<div style="align-self: stretch; display: flex; align-items: flex-end; gap: 8px; padding-right: 4%">
<svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><use href="#kh"></use><ellipse cx="38" cy="49" rx="4.4" ry="5.4" fill="#2B1D14"></ellipse><circle cx="39" cy="51" r="1.5" fill="#FFFFFF"></circle><ellipse cx="62" cy="49" rx="4.4" ry="5.4" fill="#2B1D14"></ellipse><circle cx="63" cy="51" r="1.5" fill="#FFFFFF"></circle><path d="M44 63 Q50 67 56 63" stroke="#2B1D14" stroke-width="2.4" stroke-linecap="round" fill="none"></path><path d="M52 64.5 q4 0 4 4 q0 3 -3 3 q-3 0 -3 -4z" fill="#F28E7A"></path></svg>
<div style="flex: 1 1 auto; min-width: 0; padding: 14px; border-radius: 22px 22px 22px 6px; background: rgba(255, 255, 255, 0.94); box-shadow: 0 10px 28px rgba(80, 50, 20, 0.10); display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; line-height: 1.45">Останнє, найсмачніше питання. Чого ти не їси? Так я не пропонуватиму зайвого.</span>

<div style="display: flex; flex-wrap: wrap; gap: 6px" role="group" aria-label="Не їм">
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid #B9521A; background: #FDEBDB; font-size: 13px; font-weight: 700; color: #2A2118; cursor: pointer; display: flex; align-items: center; gap: 6px" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B9521A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Рибу</button>
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid transparent; background: #F7F1E9; font-size: 13px; font-weight: 600; color: #2A2118; cursor: pointer" aria-pressed="false">Свинину</button>
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid transparent; background: #F7F1E9; font-size: 13px; font-weight: 600; color: #2A2118; cursor: pointer" aria-pressed="false">Молочне</button>
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid transparent; background: #F7F1E9; font-size: 13px; font-weight: 600; color: #2A2118; cursor: pointer" aria-pressed="false">Глютен</button>
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid transparent; background: #F7F1E9; font-size: 13px; font-weight: 600; color: #2A2118; cursor: pointer" aria-pressed="false">М'ясо</button>
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid transparent; background: #F7F1E9; font-size: 13px; font-weight: 600; color: #2A2118; cursor: pointer" aria-pressed="false">Гриби</button>
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid transparent; background: #F7F1E9; font-size: 13px; font-weight: 600; color: #2A2118; cursor: pointer" aria-pressed="false">Гостре</button>
<button style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid transparent; background: #F7F1E9; font-size: 13px; font-weight: 600; color: #2A2118; cursor: pointer" aria-pressed="false">Все їм</button>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 14px; background: #F7F1E9">
<label for="ob-allergy" style="font-size: 12px; font-weight: 600; color: #6B5D50">Алергії</label>
<input id="ob-allergy" type="text" placeholder="наприклад, горіхи" style="border: none; outline: none; background: transparent; font-size: 15px; color: #2A2118; padding: 0; min-height: 24px">
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; border-radius: 14px; background: #FFF4EA">
<label for="ob-loves" style="font-size: 12px; font-weight: 600; color: #6B4A33">Що любиш їсти?</label>
<input id="ob-loves" type="text" value="гречка, курка, сирники" style="border: none; outline: none; background: transparent; font-size: 15px; font-weight: 600; color: #2A2118; padding: 0; min-height: 24px">
</div>

<button style="min-height: 48px; border-radius: 24px; border: none; background: #B9521A; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">Порахувати мій план</button>
</div>
</div>

</main>

<div style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 0 10px" aria-label="Крок 4 з 4">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #B9521A"></span>
<span style="width: 22px; height: 6px; border-radius: 3px; background: #B9521A"></span>
</div>

<form style="margin: 0 16px 10px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(80, 50, 20, 0.12)">
<label for="msg-o4" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Відповідь</label>
<input id="msg-o4" type="text" placeholder="Або напиши своїми словами…" style="flex: 1 1 auto; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; color: #2A2118; height: 38px">
<button type="submit" aria-label="Надіслати" style="width: 42px; height: 42px; border-radius: 21px; border: none; background: #B9521A; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</form>

<div style="display: flex; justify-content: center; padding: 0 0 24px">
<button style="min-height: 44px; padding: 0 16px; border: none; background: none; font-size: 14px; font-weight: 600; color: #4F4237; cursor: pointer; text-decoration: underline">Пропустити й почати одразу</button>
</div>

</div>
</div>
</body>
</html>
