name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# public repo: the workflow only needs to read the code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # API e2e tests need a real DB; same image, credentials and host port as docker-compose.yml,
    # so the DATABASE_URL in apps/api/vitest.config.mts works unchanged (tests create kus_test themselves)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kus
          POSTGRES_PASSWORD: kus
          POSTGRES_DB: kus
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kus -d kus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall builds @kus/shared and generates the Prisma client
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # tests run through Vite; only a real build checks the prod path (CJS api requiring ESM shared)
      - run: pnpm build
