<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kusik — логотип</title>
</head>
<body>
<div class="board">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B9521A}a:hover{color:#8F3E12}
</style>

<div style="width: 1270px; height: 760px; box-sizing: border-box; padding: 56px; display: grid; grid-template-columns: 520px minmax(0, 1fr); gap: 40px; background: #FBF7F1; color: #2A2118; font-family: 'Manrope', sans-serif; position: relative">

<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<linearGradient id="prGrad" x1="0.15" y1="0.1" x2="0.85" y2="0.95"><stop offset="0" stop-color="#FFB877"></stop><stop offset="1" stop-color="#D45F22"></stop></linearGradient>
<mask id="prBite"><rect width="100" height="100" fill="#FFFFFF"></rect><circle cx="91" cy="31" r="10" fill="#000000"></circle><circle cx="83" cy="18" r="10" fill="#000000"></circle><circle cx="70" cy="10" r="9.5" fill="#000000"></circle></mask>
<symbol id="prMark" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="42" fill="url(#prGrad)" mask="url(#prBite)"></circle>
</symbol>
</defs>
</svg>

<div style="border-radius: 32px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(80, 50, 20, 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<svg width="340" height="340" viewBox="0 0 100 100" aria-label="Логотип Kusik: надкушений пряник із літерою k на глазурі" style="filter: drop-shadow(0 14px 18px rgba(150, 70, 20, 0.2))">
<use href="#prMark" style="color: #B9521A"></use>
<text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text>
</svg>
<span style="font-size: 15px; color: #5E5145">Основний знак</span>
</div>

<div style="display: flex; flex-direction: column; gap: 24px">

<section style="border-radius: 28px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(80, 50, 20, 0.08); padding: 28px; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 13px; font-weight: 700; color: #5E5145; letter-spacing: 0.06em; text-transform: uppercase">Знак із назвою</span>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="76" height="76" viewBox="0 0 100 100" aria-hidden="true"><use href="#prMark" style="color: #B9521A"></use><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<span style="font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">kusik</span>
</div>
</section>

<section style="border-radius: 28px; background: #FFFFFF; box-shadow: 0 10px 28px rgba(80, 50, 20, 0.08); padding: 28px; display: flex; flex-direction: column; gap: 18px">
<span style="font-size: 13px; font-weight: 700; color: #5E5145; letter-spacing: 0.06em; text-transform: uppercase">Малі розміри · 64 / 40 / 24 px</span>
<div style="display: flex; align-items: flex-end; gap: 28px">
<svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><use href="#prMark" style="color: #B9521A"></use><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><use href="#prMark" style="color: #B9521A"></use><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><use href="#prMark" style="color: #B9521A"></use><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
</div>
</section>

<section style="border-radius: 28px; background: #2A2118; padding: 28px; display: flex; flex-direction: column; gap: 18px; color: #FFFFFF; flex: 1 1 auto">
<span style="font-size: 13px; font-weight: 700; color: #CDBFB1; letter-spacing: 0.06em; text-transform: uppercase">На темному фоні</span>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="76" height="76" viewBox="0 0 100 100" aria-hidden="true"><use href="#prMark" style="color: #B9521A"></use><text x="47" y="66" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="46" fill="#FFF4E6">k</text></svg>
<span style="font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">kusik</span>
</div>
</section>

</div>
</div>
</div>
</body>
</html>
