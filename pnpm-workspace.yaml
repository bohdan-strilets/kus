packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

overrides:
  mysql2: 3.23.1
  # @nestjs/platform-express 11.x pins multer 2.4.0 exactly (DoS, fixed in 2.5.0); drop this when it moves on
  '@nestjs/platform-express>multer': 2.5.0
  # axios 1.20 resolves follow-redirects 1.16.1 (GHSA-mrwp-f3q8-3g9p, fixed in 1.16.2); drop when axios moves on
  'axios>follow-redirects': 1.16.2
